// ---- Straßen + Gehwege (texturiert) ----

}

// ---- Detaillierte Häuser pro Block (InstancedMesh: Wände, Dächer, Fenster, Türen, Schornsteine) ----
const blocks = new Map();

const lit = () => (rnd() < 0.12 ? 0xffe9a0 : 0x7fa8c8);
const trees = [];
for (let i = -N; i < N; i++) for (let j = -N; j < N; j++) {
